<!-- admin.html (LT) -->
<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP Administracija</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1400px; margin: 100px auto; padding: 20px; }
        .tabs { display: flex; gap: 20px; margin-bottom: 40px; border-bottom: 1px solid rgba(17, 57, 57, 0.1); padding-bottom: 10px; }
        .tab-btn { background: transparent; border: none; font-family: var(--font-heading); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; color: rgba(26, 43, 43, 0.5); transition: color 0.3s; }
        .tab-btn.active { color: var(--accent-color); font-weight: 500; }
        .request-card { background: var(--surface-color); padding: 30px; margin-bottom: 30px; border-radius: 4px; box-shadow: 0 10px 30px rgba(17, 57, 57, 0.05); border: 1px solid rgba(17, 57, 57, 0.05); }
        .req-header { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-heading); margin-bottom: 20px; border-bottom: 1px solid rgba(17, 57, 57, 0.1); padding-bottom: 15px; font-size: 1.2rem; }
        .req-body { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; font-family: var(--font-body); font-size: 1rem; color: var(--text-color); }
        .req-body p { margin-bottom: 12px; line-height: 1.6; }
        .admin-select { padding: 12px; font-family: var(--font-body); border: 1px solid rgba(17, 57, 57, 0.2); outline: none; width: 100%; max-width: 100%; margin-top: 5px; background: transparent; color: var(--text-color); transition: border-color 0.3s; }
        .admin-select:focus { border-color: var(--accent-color); }
        .req-actions { margin-top: 25px; display: flex; gap: 15px; border-top: 1px solid rgba(17, 57, 57, 0.1); padding-top: 20px; }
        .admin-btn { padding: 15px 30px; background: var(--accent-color); color: var(--bg-color); border: 1px solid var(--accent-color); cursor: pointer; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; }
        .admin-btn:hover { background: transparent; color: var(--accent-color); }
        .admin-btn-delete { padding: 15px 30px; background: transparent; color: #d9534f; border: 1px solid #d9534f; cursor: pointer; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; }
        .admin-btn-delete:hover { background: #d9534f; color: #fff; }
        #auth-section { text-align: center; margin-top: 150px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @media (max-width: 768px) {
            .req-body { grid-template-columns: 1fr; gap: 15px; }
            .req-actions { flex-direction: column; }
            .admin-btn, .admin-btn-delete { width: 100%; }
        }
    </style>
</head>
<body>
    <header id="main-header" class="scrolled">
        <div class="header-container">
            <div class="logo"><img src="https://iili.io/fjNLbs4.png" alt="DP.PORTFOLIO"></div>
            <nav class="desktop-nav"><a href="#" id="logout-btn" class="nav-link" style="display:none;">Atsijungti</a></nav>
        </div>
    </header>

    <div id="auth-section">
        <h2 style="font-family: var(--font-heading); margin-bottom: 20px;">Administratoriaus Prisijungimas</h2>
        <button id="admin-login-btn" class="cta-button" style="width: 300px;">Prisijungti su Google</button>
    </div>

    <div id="dashboard-section" class="admin-container" style="display:none;">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tfp')">TFP Užklausos</button>
            <button class="tab-btn" onclick="switchTab('services')">Mokamos Paslaugos</button>
        </div>

        <div id="tfp-tab" class="tab-content active">
            <div id="tfp-list"></div>
        </div>

        <div id="services-tab" class="tab-content">
            <div id="services-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxhDy4I4HZnqOAvwWE3JyjYsuy_Tg86xE",
            authDomain: "tfp-form.firebaseapp.com",
            projectId: "tfp-form",
            storageBucket: "tfp-form.firebasestorage.app",
            messagingSenderId: "542082314917",
            appId: "1:542082314917:web:5d3a750950a8ac4fd0d34c",
            measurementId: "G-4VRZRBDHY2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const templates = {
            lt: {
                Confirmed: {
                    subject: "DP.PORTFOLIO | TFP Fotosesija patvirtinta!",
                    html: `
                        <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1A2B2B; line-height: 1.6; max-width: 600px; margin: 0 auto;">
                            <h2 style="font-weight: 300; letter-spacing: 2px; text-transform: uppercase;">Puikios naujienos, {{name}}!</h2>
                            <p>Mums labai patiko jūsų idėja, todėl su džiaugsmu patvirtiname jūsų TFP fotosesiją!</p>
                            <div style="background: #FBF9F6; padding: 20px; border-left: 3px solid #113939; margin: 20px 0;">
                                <p style="margin: 0 0 10px 0;"><b>Susitikimo detalės:</b></p>
                                <p style="margin: 0 0 5px 0;"><b>Data ir laikas:</b> {{date_time}}</p>
                                <p style="margin: 0;"><b>Vieta:</b> {{location}}</p>
                            </div>
                            <p>Nekantraujame pradėti kurti kartu. Jei turite kokių nors klausimų prieš fotosesiją, būtinai susisiekite.</p>
                            <br>
                            <hr style="border: none; border-top: 1px solid #E5ECE9; margin: 20px 0;">
                            <p style="font-size: 0.9em; color: #2A5C5C; margin: 0;">
                                <b>DP.PORTFOLIO</b><br>
                                Dominik Šuškevič<br>
                                Instagram: <a href="https://instagram.com/dominikphotofficial" style="color: #113939; text-decoration: none;">@dominikphotofficial</a><br>
                                Web: <a href="https://portfolio.dominikphotofficial.lt" style="color: #113939; text-decoration: none;">portfolio.dominikphotofficial.lt</a>
                            </p>
                        </div>
                    `
                },
                Rescheduled: {
                    subject: "DP.PORTFOLIO | TFP Fotosesijos laikas pakeistas",
                    html: `
                        <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1A2B2B; line-height: 1.6; max-width: 600px; margin: 0 auto;">
                            <h2 style="font-weight: 300; letter-spacing: 2px; text-transform: uppercase;">Sveiki, {{name}},</h2>
                            <p>Norime informuoti, kad turėjome šiek tiek pakoreguoti jūsų TFP fotosesijos laiką arba vietą.</p>
                            <div style="background: #FBF9F6; padding: 20px; border-left: 3px solid #113939; margin: 20px 0;">
                                <p style="margin: 0 0 10px 0;"><b>Nauja informacija:</b></p>
                                <p style="margin: 0 0 5px 0;"><b>Data ir laikas:</b> {{date_time}}</p>
                                <p style="margin: 0;"><b>Vieta:</b> {{location}}</p>
                            </div>
                            <p>Jei šis naujas laikas jums netinka, prašome atsakyti į šį laišką ir nurodyti, kuriomis dienomis esate laisvi – mes būtinai rasime jums patogų variantą.</p>
                            <p>Nuoširdžiai dėkojame už jūsų supratingumą ir lankstumą!</p>
                            <br>
                            <hr style="border: none; border-top: 1px solid #E5ECE9; margin: 20px 0;">
                            <p style="font-size: 0.9em; color: #2A5C5C; margin: 0;">
                                <b>DP.PORTFOLIO</b><br>
                                Dominik Šuškevič<br>
                                Instagram: <a href="https://instagram.com/dominikphotofficial" style="color: #113939; text-decoration: none;">@dominikphotofficial</a><br>
                                Web: <a href="https://portfolio.dominikphotofficial.lt" style="color: #113939; text-decoration: none;">portfolio.dominikphotofficial.lt</a>
                            </p>
                        </div>
                    `
                },
                Cancelled: {
                    subject: "DP.PORTFOLIO | TFP Fotosesija atšaukta",
                    html: `
                        <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1A2B2B; line-height: 1.6; max-width: 600px; margin: 0 auto;">
                            <h2 style="font-weight: 300; letter-spacing: 2px; text-transform: uppercase;">Sveiki, {{name}},</h2>
                            <p>Apgailestaujame, tačiau dėl nenumatytų aplinkybių turime atšaukti jūsų TFP fotosesiją.</p>
                            <p>Labai vertiname jūsų norą bendradarbiauti ir tikimės, kad ateityje turėsime progą sukurti kažką gražaus kartu.</p>
                            <p>Ačiū už jūsų supratingumą.</p>
                            <br>
                            <hr style="border: none; border-top: 1px solid #E5ECE9; margin: 20px 0;">
                            <p style="font-size: 0.9em; color: #2A5C5C; margin: 0;">
                                <b>DP.PORTFOLIO</b><br>
                                Dominik Šuškevič<br>
                                Instagram: <a href="https://instagram.com/dominikphotofficial" style="color: #113939; text-decoration: none;">@dominikphotofficial</a><br>
                                Web: <a href="https://portfolio.dominikphotofficial.lt" style="color: #113939; text-decoration: none;">portfolio.dominikphotofficial.lt</a>
                            </p>
                        </div>
                    `
                },
                Completed: {
                    subject: "DP.PORTFOLIO | Ačiū už nuostabią fotosesiją!",
                    html: `
                        <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1A2B2B; line-height: 1.6; max-width: 600px; margin: 0 auto;">
                            <h2 style="font-weight: 300; letter-spacing: 2px; text-transform: uppercase;">Sveiki, {{name}}!</h2>
                            <p>Didelis ačiū už jūsų laiką, pastangas ir puikią nuotaiką fotosesijos metu. Tikimės, kad procesas jums patiko taip pat, kaip ir mums!</p>
                            <p>Šiuo metu jau dirbame prie jūsų nuotraukų redagavimo. Kai tik jos bus paruoštos, atsiųsime jums nuorodą.</p>
                            <p>Labai tikimės, kad galutinis rezultatas jums patiks ir viršys lūkesčius!</p>
                            <br>
                            <hr style="border: none; border-top: 1px solid #E5ECE9; margin: 20px 0;">
                            <p style="font-size: 0.9em; color: #2A5C5C; margin: 0;">
                                <b>DP.PORTFOLIO</b><br>
                                Dominik Šuškevič<br>
                                Instagram: <a href="https://instagram.com/dominikphotofficial" style="color: #113939; text-decoration: none;">@dominikphotofficial</a><br>
                                Web: <a href="https://portfolio.dominikphotofficial.lt" style="color: #113939; text-decoration: none;">portfolio.dominikphotofficial.lt</a>
                            </p>
                        </div>
                    `
                },
                ServiceStatusUpdate: {
                    subject: "DP.PORTFOLIO | Jūsų užsakymo statusas atnaujintas",
                    html: `
                        <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1A2B2B; line-height: 1.6; max-width: 600px; margin: 0 auto;">
                            <h2 style="font-weight: 300; letter-spacing: 2px; text-transform: uppercase;">Sveiki, {{name}},</h2>
                            <p>Norime informuoti, kad jūsų užsakymo (<strong>{{serviceName}}</strong>) statusas pasikeitė.</p>
                            <div style="background: #FBF9F6; padding: 20px; border-left: 3px solid #113939; margin: 20px 0;">
                                <p style="margin: 0; font-size: 1.1em;"><b>Naujas statusas:</b> <span style="color: #2A5C5C; font-weight: bold;">{{status}}</span></p>
                            </div>
                            <p>Jei turite klausimų ar norite pasitikslinti informaciją, tiesiog atsakykite į šį laišką.</p>
                            <p>Ačiū, kad esate su mumis!</p>
                            <br>
                            <hr style="border: none; border-top: 1px solid #E5ECE9; margin: 20px 0;">
                            <p style="font-size: 0.9em; color: #2A5C5C; margin: 0;">
                                <b>DP.PORTFOLIO</b><br>
                                Dominik Šuškevič<br>
                                Instagram: <a href="https://instagram.com/dominikphotofficial" style="color: #113939; text-decoration: none;">@dominikphotofficial</a><br>
                                Web: <a href="https://portfolio.dominikphotofficial.lt" style="color: #113939; text-decoration: none;">portfolio.dominikphotofficial.lt</a>
                            </p>
                        </div>
                    `
                }
            }
        };

        function buildEmail(templateType, lang, data) {
            const safeLang = templates[lang] ? lang : 'lt';
            let subject = templates[safeLang][templateType].subject;
            let html = templates[safeLang][templateType].html;
            for (const key in data) {
                const regex = new RegExp(`{{${key}}}`, 'g');
                html = html.replace(regex, data[key] || '');
                subject = subject.replace(regex, data[key] || '');
            }
            return { subject, html };
        }

        const ADMIN_EMAIL = "dominikphotofficial.lt@gmail.com"; 

        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const logoutBtn = document.getElementById('logout-btn');

        document.getElementById('admin-login-btn').addEventListener('click', () => {
            signInWithPopup(auth, googleProvider);
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                authSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                logoutBtn.style.display = 'block';
                loadTFPRequests();
                loadServiceRequests();
            } else if (user) {
                alert("Priėjimas uždraustas.");
                signOut(auth);
            } else {
                authSection.style.display = 'block';
                dashboardSection.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tab === 'tfp') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tfp-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('services-tab').classList.add('active');
            }
        };

        function loadTFPRequests() {
            const q = query(collection(db, "tfp_requests"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('tfp-list');
                list.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const reqDiv = document.createElement('div');
                    reqDiv.className = 'request-card';
                    reqDiv.innerHTML = `
                        <div class="req-header">
                            <strong>${data.name} <span style="color: var(--accent-light); font-size: 0.9rem;">(${data.language.toUpperCase()})</span></strong>
                            <span>Statusas: <strong style="color: var(--accent-light); letter-spacing: 1px;">${data.status}</strong></span>
                        </div>
                        <div class="req-body">
                            <div>
                                <p><b>El. paštas:</b><br>${data.email}</p>
                                <p><b>Instagram:</b><br>${data.instagram}</p>
                                <p><b>Idėja:</b><br>${data.idea}</p>
                                <p><b>Papildomai:</b><br>${data.extra_info || '-'}</p>
                            </div>
                            <div>
                                <p><b>Data ir laikas:</b><br><input type="text" id="dt-${docSnap.id}" value="${data.date_time}" class="admin-select"></p>
                                <p><b>Vieta:</b><br><input type="text" id="loc-${docSnap.id}" value="${data.location}" class="admin-select"></p>
                                <p><b>Keisti statusą:</b><br>
                                <select id="status-${docSnap.id}" class="admin-select">
                                    <option value="New" ${data.status === 'New' ? 'selected' : ''}>New</option>
                                    <option value="Confirmed" ${data.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                    <option value="Rescheduled" ${data.status === 'Rescheduled' ? 'selected' : ''}>Rescheduled</option>
                                    <option value="Cancelled" ${data.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                    <option value="Completed" ${data.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                </select></p>
                            </div>
                        </div>
                        <div class="req-actions">
                            <button class="admin-btn" onclick="updateTFP('${docSnap.id}', '${data.language}', '${data.email}', '${data.name}', '${data.idea.replace(/'/g, "\\'")}')">Išsaugoti ir Išsiųsti laišką</button>
                            <button class="admin-btn-delete" onclick="deleteDocRecord('tfp_requests', '${docSnap.id}')">Ištrinti</button>
                        </div>
                    `;
                    list.appendChild(reqDiv);
                });
            });
        }

        function loadServiceRequests() {
            const q = query(collection(db, "service_requests"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('services-list');
                list.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const reqDiv = document.createElement('div');
                    reqDiv.className = 'request-card';
                    reqDiv.innerHTML = `
                        <div class="req-header">
                            <strong>${data.clientName} <span style="color: var(--accent-light); font-size: 0.9rem;">(${data.language.toUpperCase()})</span></strong>
                            <span>Statusas: <strong style="color: var(--accent-light); letter-spacing: 1px;">${data.status}</strong></span>
                        </div>
                        <div class="req-body">
                            <div>
                                <p><b>Paslauga:</b><br>${data.serviceName}</p>
                                <p><b>El. paštas:</b><br>${data.email}</p>
                                <p><b>Telefonas / Social:</b><br>${data.phone} / ${data.socialProfile}</p>
                                <p><b>Apmokėjimas:</b><br>${data.paymentMethod}</p>
                                <p><b>Idėja / Info:</b><br>${data.additionalInformation}</p>
                            </div>
                            <div>
                                <p><b>Kaina:</b> ${data.finalPrice} € (Avansas: ${data.depositAmount} €)</p>
                                <p><b>Data:</b><br><input type="text" id="srv-dt-${docSnap.id}" value="${data.preferredDate} ${data.preferredTime}" class="admin-select"></p>
                                <p><b>Vieta:</b><br><input type="text" id="srv-loc-${docSnap.id}" value="${data.location}" class="admin-select"></p>
                                <p><b>Keisti statusą:</b><br>
                                <select id="srv-status-${docSnap.id}" class="admin-select">
                                    <option value="Pending" ${data.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Confirmed" ${data.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                    <option value="Deposit Paid" ${data.status === 'Deposit Paid' ? 'selected' : ''}>Deposit Paid</option>
                                    <option value="In Progress" ${data.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                    <option value="Completed" ${data.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                    <option value="Fully Paid" ${data.status === 'Fully Paid' ? 'selected' : ''}>Fully Paid</option>
                                    <option value="Cancelled" ${data.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select></p>
                            </div>
                        </div>
                        <div class="req-actions">
                            <button class="admin-btn" onclick="updateService('${docSnap.id}', '${data.language}', '${data.email}', '${data.clientName}', '${data.serviceName}')">Išsaugoti ir Išsiųsti laišką</button>
                            <button class="admin-btn-delete" onclick="deleteDocRecord('service_requests', '${docSnap.id}')">Ištrinti</button>
                        </div>
                    `;
                    list.appendChild(reqDiv);
                });
            });
        }

        window.updateTFP = async (id, lang, email, name, idea) => {
            const newStatus = document.getElementById(`status-${id}`).value;
            const newDate = document.getElementById(`dt-${id}`).value;
            const newLoc = document.getElementById(`loc-${id}`).value;

            try {
                await updateDoc(doc(db, "tfp_requests", id), { status: newStatus, date_time: newDate, location: newLoc });
                if(newStatus !== 'New') {
                    const emailData = buildEmail(newStatus, lang, { name, date_time: newDate, location: newLoc, idea });
                    await addDoc(collection(db, "mail"), { to: email, message: { subject: emailData.subject, html: emailData.html } });
                }
                alert("TFP atnaujinta!");
            } catch(e) { console.error(e); alert("Klaida."); }
        };

        window.updateService = async (id, lang, email, name, serviceName) => {
            const newStatus = document.getElementById(`srv-status-${id}`).value;
            const newDate = document.getElementById(`srv-dt-${id}`).value;
            const newLoc = document.getElementById(`srv-loc-${id}`).value;

            try {
                await updateDoc(doc(db, "service_requests", id), { status: newStatus, preferredDate: newDate, location: newLoc });
                const emailData = buildEmail('ServiceStatusUpdate', lang, { name, serviceName, status: newStatus });
                await addDoc(collection(db, "mail"), { to: email, message: { subject: emailData.subject, html: emailData.html } });
                alert("Paslauga atnaujinta!");
            } catch(e) { console.error(e); alert("Klaida."); }
        };

        window.deleteDocRecord = async (collectionName, id) => {
            if (confirm("Ar tikrai norite ištrinti?")) {
                try { await deleteDoc(doc(db, collectionName, id)); } 
                catch(e) { console.error(e); alert("Klaida trinant."); }
            }
        };
    </script>
</body>
</html>

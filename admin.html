<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP Administracija</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1400px; margin: 100px auto; padding: 20px; }
        .dashboard-stats { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .stat-box { background: var(--surface-color); padding: 20px; border-radius: 8px; flex: 1; min-width: 200px; border: 1px solid rgba(17, 57, 57, 0.05); text-align: center; }
        .stat-box h3 { font-family: var(--font-heading); font-size: 1rem; color: rgba(26, 43, 43, 0.6); margin-bottom: 10px; }
        .stat-box p { font-family: var(--font-heading); font-size: 2.5rem; color: var(--accent-color); font-weight: 300; }
        
        .tabs { display: flex; gap: 20px; margin-bottom: 40px; border-bottom: 1px solid rgba(17, 57, 57, 0.1); padding-bottom: 10px; }
        .tab-btn { background: transparent; border: none; font-family: var(--font-heading); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; color: rgba(26, 43, 43, 0.5); transition: color 0.3s; }
        .tab-btn.active { color: var(--accent-color); font-weight: 500; }
        
        .request-card { background: var(--surface-color); padding: 30px; margin-bottom: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(17, 57, 57, 0.05); border: 1px solid rgba(17, 57, 57, 0.05); }
        .req-header { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-heading); margin-bottom: 20px; border-bottom: 1px solid rgba(17, 57, 57, 0.1); padding-bottom: 15px; font-size: 1.2rem; }
        .req-body { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; font-family: var(--font-body); font-size: 1rem; color: var(--text-color); }
        .req-body p { margin-bottom: 12px; line-height: 1.6; }
        
        .admin-select { padding: 12px; font-family: var(--font-body); border: 1px solid rgba(17, 57, 57, 0.2); outline: none; width: 100%; max-width: 100%; margin-top: 5px; background: #fff; color: var(--text-color); transition: border-color 0.3s; border-radius: 4px; }
        .admin-select:focus { border-color: var(--accent-color); }
        
        .req-actions { margin-top: 25px; display: flex; gap: 15px; border-top: 1px solid rgba(17, 57, 57, 0.1); padding-top: 20px; flex-wrap: wrap; }
        .admin-btn { padding: 15px 30px; background: var(--accent-color); color: var(--bg-color); border: 1px solid var(--accent-color); cursor: pointer; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; border-radius: 4px; }
        .admin-btn:hover { background: transparent; color: var(--accent-color); }
        .admin-btn-outline { padding: 15px 30px; background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); cursor: pointer; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; border-radius: 4px; }
        .admin-btn-outline:hover { background: var(--accent-color); color: var(--bg-color); }
        .admin-btn-delete { padding: 15px 30px; background: transparent; color: #d9534f; border: 1px solid #d9534f; cursor: pointer; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; border-radius: 4px; }
        .admin-btn-delete:hover { background: #d9534f; color: #fff; }
        
        #auth-section { max-width: 400px; margin: 150px auto; text-align: center; background: var(--surface-color); padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .auth-divider { margin: 20px 0; font-family: var(--font-heading); color: rgba(26, 43, 43, 0.5); text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; display: flex; align-items: center; }
        .auth-divider::before, .auth-divider::after { content: ""; flex: 1; border-bottom: 1px solid rgba(17, 57, 57, 0.1); margin: 0 10px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 15, 15, 0.8); z-index: 3000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-color); width: 90%; max-width: 800px; padding: 40px; border-radius: 8px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        
        .logout-btn-header { background: #d9534f; color: white; padding: 8px 20px; border-radius: 4px; font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; border: none; cursor: pointer; transition: 0.3s; }
        .logout-btn-header:hover { background: #c9302c; }

        @media (max-width: 768px) {
            .req-body { grid-template-columns: 1fr; gap: 15px; }
            .req-actions { flex-direction: column; }
            .admin-btn, .admin-btn-outline, .admin-btn-delete { width: 100%; }
            .modal-content { padding: 20px; }
        }
    </style>
</head>
<body>
    <header id="main-header" class="scrolled">
        <div class="header-container">
            <div class="logo"><img src="https://iili.io/fjNLbs4.png" alt="DP.PORTFOLIO"></div>
            <nav class="desktop-nav"><button id="logout-btn" class="logout-btn-header" style="display:none;">Atsijungti</button></nav>
        </div>
    </header>

    <div id="auth-section">
        <h2 style="font-family: var(--font-heading); margin-bottom: 25px; font-weight: 400; letter-spacing: 2px;">Prisijungimas</h2>
        <input type="email" id="admin-email" class="admin-select" placeholder="El. paštas" style="margin-bottom: 15px;">
        <input type="password" id="admin-password" class="admin-select" placeholder="Slaptažodis" style="margin-bottom: 20px;">
        <button id="admin-login-email-btn" class="admin-btn" style="width: 100%;">Prisijungti</button>
        <div class="auth-divider">ARBA</div>
        <button id="admin-login-google-btn" class="admin-btn-outline" style="width: 100%;">Prisijungti su Google</button>
    </div>

    <div id="dashboard-section" class="admin-container" style="display:none;">
        <div class="dashboard-stats">
            <div class="stat-box"><h3>Naujos TFP</h3><p id="stat-tfp-new">0</p></div>
            <div class="stat-box"><h3>Naujos Paslaugos</h3><p id="stat-srv-new">0</p></div>
            <div class="stat-box"><h3>Patvirtinta (Viso)</h3><p id="stat-confirmed">0</p></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tfp')">TFP Užklausos</button>
            <button class="tab-btn" onclick="switchTab('services')">Mokamos Paslaugos</button>
        </div>

        <div id="tfp-tab" class="tab-content active">
            <div id="tfp-list">Kraunama...</div>
        </div>

        <div id="services-tab" class="tab-content">
            <div id="services-list">Kraunama...</div>
        </div>
    </div>

    <div id="email-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="font-family: var(--font-heading); margin-bottom: 10px; font-size: 1.8rem; font-weight: 300; letter-spacing: 3px;">Redaguoti laišką</h2>
            <p style="font-family: var(--font-body); margin-bottom: 30px; opacity: 0.8;">Čia galite pakeisti tekstą prieš išsiunčiant laišką klientui.</p>
            <label style="display: block; font-family: var(--font-heading); font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-color); margin-bottom: 10px;">Tema (Subject)</label>
            <input type="text" id="modal-subject" class="admin-select" style="margin-bottom: 25px; background: #fff;">
            <label style="display: block; font-family: var(--font-heading); font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-color); margin-bottom: 10px;">Laiško turinys (HTML)</label>
            <textarea id="modal-html" class="admin-select" style="height: 350px; margin-bottom: 30px; font-family: monospace; font-size: 14px; line-height: 1.5; background: #fff;"></textarea>
            <div class="req-actions" style="border: none; padding: 0; margin: 0; justify-content: flex-end;">
                <button class="admin-btn-delete" onclick="closeModal()" style="border-color: transparent; color: var(--text-color);">Atšaukti</button>
                <button class="admin-btn" id="modal-send-btn">Patvirtinti ir Siųsti</button>
            </div>
        </div>
    </div>

    <footer style="background-color: #ffffff; padding: 40px 20px; text-align: center; border-top: 1px solid rgba(17, 57, 57, 0.1); margin-top: 60px;">
        <h3 style="font-family: var(--font-heading); color: var(--accent-color); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px;">DP.PORTFOLIO Kontaktai</h3>
        <p style="font-family: var(--font-body); color: rgba(26, 43, 43, 0.6); font-size: 0.9rem;">Dominik Šuškevič | dominikphotofficial.lt@gmail.com</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
        import { buildEmail } from './email-templates.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBxhDy4I4HZnqOAvwWE3JyjYsuy_Tg86xE",
            authDomain: "tfp-form.firebaseapp.com",
            projectId: "tfp-form",
            storageBucket: "tfp-form.firebasestorage.app",
            messagingSenderId: "542082314917",
            appId: "1:542082314917:web:5d3a750950a8ac4fd0d34c",
            measurementId: "G-4VRZRBDHY2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "dominikphotofficial.lt@gmail.com"; 

        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const logoutBtn = document.getElementById('logout-btn');
        let pendingEmailData = null;

        getRedirectResult(auth).catch((error) => console.error("Auth Error:", error));

        document.getElementById('admin-login-google-btn').addEventListener('click', () => {
            signInWithRedirect(auth, googleProvider);
        });

        document.getElementById('admin-login-email-btn').addEventListener('click', () => {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-password').value;
            if(!email || !pass) { alert("Įveskite el. paštą ir slaptažodį"); return; }
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Klaida: " + e.message));
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                authSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                logoutBtn.style.display = 'block';
                loadTFPRequests();
                loadServiceRequests();
            } else if (user) {
                alert("Priėjimas uždraustas. Prisijungėte ne su administratoriaus paskyra.");
                signOut(auth);
            } else {
                authSection.style.display = 'block';
                dashboardSection.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tab === 'tfp') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tfp-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('services-tab').classList.add('active');
            }
        };

        function updateStats(tfpCount, srvCount, confirmedCount) {
            document.getElementById('stat-tfp-new').innerText = tfpCount;
            document.getElementById('stat-srv-new').innerText = srvCount;
            document.getElementById('stat-confirmed').innerText = confirmedCount;
        }

        let tfpNew = 0, srvNew = 0, totalConfirmed = 0;

        function loadTFPRequests() {
            const q = query(collection(db, "tfp_requests"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('tfp-list');
                list.innerHTML = '';
                tfpNew = 0;
                let confirmed = 0;
                
                if(snapshot.empty) { list.innerHTML = '<p>Užklausų kol kas nėra.</p>'; }
                
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if(data.status === 'New') tfpNew++;
                    if(data.status === 'Confirmed') confirmed++;

                    const reqDiv = document.createElement('div');
                    reqDiv.className = 'request-card';
                    
                    let photosHtml = '';
                    if (data.reference_photos && data.reference_photos.length > 0) {
                        photosHtml = '<p><b>Referencijos:</b><br><div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:5px;">';
                        data.reference_photos.forEach(url => {
                            photosHtml += `<a href="${url}" target="_blank"><img src="${url}" style="width:60px; height:60px; object-fit:cover; border-radius:4px; border:1px solid #ccc;"></a>`;
                        });
                        photosHtml += '</div></p>';
                    }

                    reqDiv.innerHTML = `
                        <div class="req-header">
                            <strong>${data.name} <span style="color: var(--accent-light); font-size: 0.9rem;">(${data.language.toUpperCase()})</span></strong>
                            <span>Statusas: <strong style="color: var(--accent-light); letter-spacing: 1px;">${data.status}</strong></span>
                        </div>
                        <div class="req-body">
                            <div>
                                <p><b>El. paštas:</b><br>${data.email}</p>
                                <p><b>Instagram:</b><br>${data.instagram}</p>
                                <p><b>Idėja:</b><br>${data.idea}</p>
                                <p><b>Papildomai:</b><br>${data.extra_info || '-'}</p>
                                ${photosHtml}
                            </div>
                            <div>
                                <p><b>Data ir laikas:</b><br><input type="text" id="dt-${docSnap.id}" value="${data.date_time}" class="admin-select"></p>
                                <p><b>Vieta:</b><br><input type="text" id="loc-${docSnap.id}" value="${data.location}" class="admin-select"></p>
                                <p><b>Keisti statusą:</b><br>
                                <select id="status-${docSnap.id}" class="admin-select">
                                    <option value="New" ${data.status === 'New' ? 'selected' : ''}>New (Nauja)</option>
                                    <option value="Confirmed" ${data.status === 'Confirmed' ? 'selected' : ''}>Confirmed (Patvirtinta)</option>
                                    <option value="Rescheduled" ${data.status === 'Rescheduled' ? 'selected' : ''}>Rescheduled (Perkelta)</option>
                                    <option value="Cancelled" ${data.status === 'Cancelled' ? 'selected' : ''}>Cancelled (Atšaukta)</option>
                                    <option value="Completed" ${data.status === 'Completed' ? 'selected' : ''}>Completed (Atlikta)</option>
                                </select></p>
                            </div>
                        </div>
                        <div class="req-actions">
                            <button class="admin-btn" onclick="prepareTFP('${docSnap.id}', '${data.language}', '${data.email}', '${data.name}', '${data.idea.replace(/'/g, "\\'")}')">Peržiūrėti ir Siųsti laišką</button>
                            <button class="admin-btn-outline" onclick="saveOnly('tfp_requests', '${docSnap.id}', '')">Tik Išsaugoti</button>
                            <button class="admin-btn-delete" onclick="deleteDocRecord('tfp_requests', '${docSnap.id}')">Ištrinti</button>
                        </div>
                    `;
                    list.appendChild(reqDiv);
                });
                totalConfirmed = confirmed;
                updateStats(tfpNew, srvNew, totalConfirmed);
            }, (error) => {
                document.getElementById('tfp-list').innerHTML = `<p style="color:red;">Klaida: ${error.message}</p>`;
            });
        }

        function loadServiceRequests() {
            const q = query(collection(db, "service_requests"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('services-list');
                list.innerHTML = '';
                srvNew = 0;
                let confirmed = 0;

                if(snapshot.empty) { list.innerHTML = '<p>Užsakymų kol kas nėra.</p>'; }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if(data.status === 'Pending') srvNew++;
                    if(data.status === 'Confirmed' || data.status === 'Deposit Paid') confirmed++;

                    const reqDiv = document.createElement('div');
                    reqDiv.className = 'request-card';
                    
                    let photosHtml = '';
                    if (data.reference_photos && data.reference_photos.length > 0) {
                        photosHtml = '<p><b>Referencijos:</b><br><div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:5px;">';
                        data.reference_photos.forEach(url => {
                            photosHtml += `<a href="${url}" target="_blank"><img src="${url}" style="width:60px; height:60px; object-fit:cover; border-radius:4px; border:1px solid #ccc;"></a>`;
                        });
                        photosHtml += '</div></p>';
                    }

                    reqDiv.innerHTML = `
                        <div class="req-header">
                            <strong>${data.clientName} <span style="color: var(--accent-light); font-size: 0.9rem;">(${data.language.toUpperCase()})</span></strong>
                            <span>Statusas: <strong style="color: var(--accent-light); letter-spacing: 1px;">${data.status}</strong></span>
                        </div>
                        <div class="req-body">
                            <div>
                                <p><b>Paslauga:</b><br>${data.serviceName}</p>
                                <p><b>El. paštas:</b><br>${data.email}</p>
                                <p><b>Telefonas / Social:</b><br>${data.phone} / ${data.socialProfile}</p>
                                <p><b>Apmokėjimas:</b><br>${data.paymentMethod}</p>
                                <p><b>Idėja / Info:</b><br>${data.additionalInformation}</p>
                                ${photosHtml}
                            </div>
                            <div>
                                <p><b>Kaina:</b> ${data.finalPrice} € (Avansas: ${data.depositAmount} €)</p>
                                <p><b>Data:</b><br><input type="text" id="srv-dt-${docSnap.id}" value="${data.preferredDate} ${data.preferredTime}" class="admin-select"></p>
                                <p><b>Vieta:</b><br><input type="text" id="srv-loc-${docSnap.id}" value="${data.location}" class="admin-select"></p>
                                <p><b>Keisti statusą:</b><br>
                                <select id="srv-status-${docSnap.id}" class="admin-select">
                                    <option value="Pending" ${data.status === 'Pending' ? 'selected' : ''}>Pending (Laukia)</option>
                                    <option value="Confirmed" ${data.status === 'Confirmed' ? 'selected' : ''}>Confirmed (Patvirtinta)</option>
                                    <option value="Deposit Paid" ${data.status === 'Deposit Paid' ? 'selected' : ''}>Deposit Paid (Avansas gautas)</option>
                                    <option value="In Progress" ${data.status === 'In Progress' ? 'selected' : ''}>In Progress (Vykdoma)</option>
                                    <option value="Completed" ${data.status === 'Completed' ? 'selected' : ''}>Completed (Atlikta)</option>
                                    <option value="Fully Paid" ${data.status === 'Fully Paid' ? 'selected' : ''}>Fully Paid (Pilnai apmokėta)</option>
                                    <option value="Cancelled" ${data.status === 'Cancelled' ? 'selected' : ''}>Cancelled (Atšaukta)</option>
                                </select></p>
                            </div>
                        </div>
                        <div class="req-actions">
                            <button class="admin-btn" onclick="prepareService('${docSnap.id}', '${data.language}', '${data.email}', '${data.clientName}', '${data.serviceName}', ${data.finalPrice}, ${data.depositAmount})">Peržiūrėti ir Siųsti laišką</button>
                            <button class="admin-btn-outline" onclick="saveOnly('service_requests', '${docSnap.id}', 'srv-')">Tik Išsaugoti</button>
                            <button class="admin-btn-delete" onclick="deleteDocRecord('service_requests', '${docSnap.id}')">Ištrinti</button>
                        </div>
                    `;
                    list.appendChild(reqDiv);
                });
                totalConfirmed += confirmed;
                updateStats(tfpNew, srvNew, totalConfirmed);
            }, (error) => {
                document.getElementById('services-list').innerHTML = `<p style="color:red;">Klaida: ${error.message}</p>`;
            });
        }

        window.prepareTFP = async (id, lang, email, name, idea) => {
            const newStatus = document.getElementById(`status-${id}`).value;
            const newDate = document.getElementById(`dt-${id}`).value;
            const newLoc = document.getElementById(`loc-${id}`).value;

            let templateKey = 'ServiceStatusUpdate';
            if (newStatus === 'Confirmed') templateKey = 'TFPConfirmed';
            else if (newStatus === 'Rescheduled') templateKey = 'TFPRescheduled';
            else if (newStatus === 'Cancelled') templateKey = 'TFPCancelled';
            else if (newStatus === 'Completed') templateKey = 'TFPCompleted';

            const emailData = buildEmail(templateKey, lang, { name, date_time: newDate, location: newLoc, idea, status: newStatus });

            document.getElementById('modal-subject').value = emailData.subject;
            document.getElementById('modal-html').value = emailData.html;
            
            pendingEmailData = { collection: 'tfp_requests', id, email, newStatus, newDate, newLoc };
            document.getElementById('email-modal').classList.add('active');
        };

        window.prepareService = async (id, lang, email, name, serviceName, finalPrice, depositAmount) => {
            const newStatus = document.getElementById(`srv-status-${id}`).value;
            const newDate = document.getElementById(`srv-dt-${id}`).value;
            const newLoc = document.getElementById(`srv-loc-${id}`).value;

            let templateKey = 'ServiceStatusUpdate';
            if (newStatus === 'Confirmed') templateKey = 'ServiceConfirmed';
            else if (newStatus === 'Deposit Paid') templateKey = 'ServiceDepositPaid';
            else if (newStatus === 'Fully Paid') templateKey = 'ServiceFullyPaid';
            else if (newStatus === 'Completed') templateKey = 'ServiceCompleted';
            else if (newStatus === 'Cancelled') templateKey = 'ServiceCancelled';

            const emailData = buildEmail(templateKey, lang, { 
                name, serviceName, status: newStatus, date_time: newDate, location: newLoc, finalPrice, depositAmount 
            });

            document.getElementById('modal-subject').value = emailData.subject;
            document.getElementById('modal-html').value = emailData.html;
            
            pendingEmailData = { collection: 'service_requests', id, email, newStatus, newDate, newLoc };
            document.getElementById('email-modal').classList.add('active');
        };

        window.saveOnly = async (collectionName, id, prefix) => {
            const newStatus = document.getElementById(`${prefix}status-${id}`).value;
            const newDate = document.getElementById(`${prefix}dt-${id}`).value;
            const newLoc = document.getElementById(`${prefix}loc-${id}`).value;
            try {
                if(collectionName === 'tfp_requests') {
                    await updateDoc(doc(db, collectionName, id), { status: newStatus, date_time: newDate, location: newLoc });
                } else {
                    await updateDoc(doc(db, collectionName, id), { status: newStatus, preferredDate: newDate, location: newLoc });
                }
                alert("Išsaugota sėkmingai (be laiško siuntimo)!");
            } catch(e) { console.error(e); alert("Klaida išsaugant."); }
        };

        window.closeModal = () => {
            document.getElementById('email-modal').classList.remove('active');
            pendingEmailData = null;
        };

        document.getElementById('modal-send-btn').addEventListener('click', async () => {
            if(!pendingEmailData) return;
            const btn = document.getElementById('modal-send-btn');
            btn.disabled = true;
            btn.innerText = 'Siunčiama...';

            try {
                const subject = document.getElementById('modal-subject').value;
                const html = document.getElementById('modal-html').value;

                if(pendingEmailData.collection === 'tfp_requests') {
                    await updateDoc(doc(db, pendingEmailData.collection, pendingEmailData.id), { 
                        status: pendingEmailData.newStatus, date_time: pendingEmailData.newDate, location: pendingEmailData.newLoc 
                    });
                } else {
                    await updateDoc(doc(db, pendingEmailData.collection, pendingEmailData.id), { 
                        status: pendingEmailData.newStatus, preferredDate: pendingEmailData.newDate, location: pendingEmailData.newLoc 
                    });
                }

                await addDoc(collection(db, "mail"), { 
                    to: pendingEmailData.email, 
                    message: { subject: subject, html: html } 
                });

                alert("Išsaugota ir laiškas išsiųstas!");
                closeModal();
            } catch(e) {
                console.error(e);
                alert("Klaida siunčiant.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Patvirtinti ir Siųsti';
            }
        });

        window.deleteDocRecord = async (collectionName, id) => {
            if (confirm("Ar tikrai norite ištrinti šią užklausą?")) {
                try { await deleteDoc(doc(db, collectionName, id)); } 
                catch(e) { console.error(e); alert("Klaida trinant."); }
            }
        };
    </script>
</body>
</html>
